<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFF8E6">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>우리 가족 기록장</title>
<style>
/* ===== base ===== */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
:root{
  --ink:#4B3A2C; --ink-soft:#8B7767; --ink-faint:#B6A594;
  --line:#F0E2C8; --line-soft:#F6EBD8;
  --pink:#E8748F; --pink-deep:#C4556F; --pink-soft:#FDE7EC;
  --mint:#CFEBD5; --mint-deep:#5DA377; --mint-soft:#EDF9EF;
  --sky:#D6EAF8; --sky-deep:#4A7FB5; --sky-soft:#EDF5FC;
  --lav:#E6DFF7; --lav-deep:#7A66B5; --lav-soft:#F3EFFC;
  --gold:#F7C86A; --gold-deep:#B58221; --gold-soft:#FFF6DF;
  --cream:#FFFDF6;
  --shadow:0 10px 22px rgba(199,168,120,.16);
  --shadow-sm:0 4px 10px rgba(199,168,120,.14);
  --dock:0px;
}
@media(min-width:520px){ :root{--dock:22px} }
body{
  font-family:"Pretendard","Apple SD Gothic Neo","AppleGothic","Noto Sans KR","Noto Sans CJK KR","Malgun Gothic","맑은 고딕",system-ui,-apple-system,sans-serif;
  background:#F0E4CE; color:var(--ink); -webkit-font-smoothing:antialiased;
  word-break:keep-all; overflow-wrap:break-word;
}
button{font-family:inherit;color:inherit}
input,textarea{font-family:inherit;color:inherit}
input[type=checkbox]{accent-color:#8FCFA3;width:14px;height:14px;vertical-align:-2px;margin:0 3px 0 0}
img{display:block}
h1,h2,h3,h4,p{margin:0}
::selection{background:#FBE3A8}

/* ===== app shell ===== */
.app{
  position:relative; max-width:430px; margin:0 auto; min-height:100vh; min-height:100dvh;
  background:
    radial-gradient(90% 34% at 50% 0%, #FFFEF7 0%, rgba(255,254,247,0) 70%),
    linear-gradient(180deg,#FFF9E9 0%,#FDF3DB 42%,#FBEEDF 78%,#FAEDE4 100%);
  padding-bottom:calc(92px + env(safe-area-inset-bottom));
  box-shadow:0 0 0 1px rgba(160,130,90,.06), 0 24px 60px rgba(120,95,60,.14);
}
@media(min-width:520px){
  body{padding:22px 0;background:radial-gradient(120% 60% at 50% 0%,#F7EDD9,#EFE2C9 70%)}
  .app{border-radius:34px;overflow:hidden}
}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:scale(1)}}
@keyframes sheetUp{from{transform:translateY(18px);opacity:.6}to{transform:none;opacity:1}}
@keyframes panelIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ===== header ===== */
.top{padding:calc(18px + env(safe-area-inset-top)) 16px 6px}
.title-row{display:flex;align-items:center;gap:8px}
.logo{width:38px;height:38px;flex:none}
.top h1{
  font-size:22px;font-weight:800;letter-spacing:-.035em;
  background:linear-gradient(96deg,#6B4A38 8%,#C4647F 48%,#E8748F 92%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  white-space:nowrap;
}
.top-actions{margin-left:auto;display:flex;gap:8px}
.iconbtn{
  width:40px;height:40px;border-radius:16px;border:1px solid var(--line);background:var(--cream);
  box-shadow:var(--shadow-sm);display:flex;align-items:center;justify-content:center;font-size:17px;
  cursor:pointer;transition:transform .12s;
}
.iconbtn:active{transform:scale(.94)}
.iconbtn.has-dot{position:relative}
.iconbtn.has-dot::after{
  content:"";position:absolute;right:9px;top:9px;width:7px;height:7px;border-radius:50%;
  background:#7FD08F;box-shadow:0 0 0 2px var(--cream)
}
.meta-row{display:flex;align-items:flex-start;gap:10px;margin-top:10px}
.date-col{flex:1 1 auto;min-width:0}
.date-line{font-size:14.5px;font-weight:700;color:#7A6552;letter-spacing:-.02em}
.hello{font-size:16px;font-weight:800;letter-spacing:-.03em;color:#5B4634;margin-top:2px}
.note-pill{
  flex:none;display:flex;align-items:center;gap:5px;font-size:11.5px;font-weight:800;color:#9A7C55;
  background:linear-gradient(180deg,#FFFDF4,#FFF7E4);border:1px solid #F2E3C4;border-radius:999px;
  padding:8px 11px;box-shadow:var(--shadow-sm);white-space:nowrap
}

/* ===== screens ===== */
.screen{display:none;padding:12px 16px 4px}
.screen.active{display:block;animation:fadeUp .28s ease both}

/* ===== cards ===== */
.card{
  background:linear-gradient(180deg,#FFFEFB 0%,#FFFBF2 100%);
  border:1px solid var(--line); border-radius:22px; padding:15px;
  box-shadow:var(--shadow); margin-bottom:13px;
}
.card.flush{padding:0;overflow:hidden}
.sec-title{display:flex;align-items:center;gap:7px;font-size:16.5px;font-weight:800;letter-spacing:-.03em}
.sec-title .em{font-size:17px;line-height:1}
.hint{font-size:11.8px;color:var(--ink-soft);line-height:1.55;font-weight:600}
.hint.tight{font-size:11.2px}
.divider{height:1px;background:var(--line-soft);margin:11px -15px}
.dashed{height:1px;background:repeating-linear-gradient(90deg,#EBDBBD 0 6px,transparent 6px 11px);margin:2px 0}

/* ===== buttons ===== */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  border-radius:15px;border:1px solid var(--line);background:#fff;color:#5B4634;
  font-size:13.5px;font-weight:800;letter-spacing:-.02em;padding:10px 13px;cursor:pointer;
  box-shadow:0 2px 0 rgba(180,150,110,.08);transition:transform .12s ease, filter .12s;
}
.btn:active{transform:translateY(1px) scale(.995)}
.btn.primary{background:linear-gradient(180deg,#D6F0DC,#BEE6CA);border-color:#AEDCBC;color:#2F6B46}
.btn.pink{background:linear-gradient(180deg,#FCDCE5,#F8C6D4);border-color:#F2B4C5;color:#9C3B57}
.btn.gold{background:linear-gradient(180deg,#FFE7B8,#FBD694);border-color:#F4CB83;color:#8A5F12}
.btn.sky{background:linear-gradient(180deg,#E0F0FD,#CBE5F9);border-color:#B9DCF4;color:#3A6E9E}
.btn.danger{background:#FFF1F1;border-color:#F4D5D5;color:#B24A4A}
.btn.wide{width:100%}
.btn.sm{font-size:12.2px;padding:8px 10px;border-radius:13px}
.btn[disabled]{opacity:.5;cursor:default;box-shadow:none}
.linkbtn{
  border:0;background:none;padding:0;font-size:12px;font-weight:800;color:var(--pink-deep);
  text-decoration:underline;text-underline-offset:3px;cursor:pointer
}

/* ===== segmented ===== */
.seg{display:inline-flex;background:#F7EFDD;border:1px solid #EFE2C6;border-radius:999px;padding:3px;gap:2px}
.seg button{
  border:0;background:transparent;border-radius:999px;padding:7px 15px;font-size:13px;
  font-weight:800;color:#9A8875;letter-spacing:-.02em;cursor:pointer;transition:all .15s;white-space:nowrap
}
.seg button.on{background:#fff;color:#4B3A2C;box-shadow:0 3px 8px rgba(180,150,110,.18)}
.seg.tint-sky button.on{background:#fff;color:#37658F}
.seg.sm button{padding:6px 12px;font-size:12.2px}

/* ===== weather ===== */
.weather{
  border-radius:22px;border:1px solid #E3EAF1;
  background:linear-gradient(115deg,#F2FAFF 0%,#FCFBF2 52%,#FFF6E6 100%);
  padding:13px 14px;box-shadow:var(--shadow);margin-bottom:13px;
}
.weather-row{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.w-ico{font-size:26px;line-height:1;filter:drop-shadow(0 2px 3px rgba(210,170,90,.25))}
.w-place{font-size:13.5px;font-weight:800;color:#5B4B3C}
.w-temp{font-size:23px;font-weight:800;letter-spacing:-.04em;color:#3F5F79}
.w-desc{font-size:12.5px;font-weight:800;color:#5E7C93}
.w-range{font-size:12px;font-weight:700;color:#8B7767}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.chip{
  display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:800;letter-spacing:-.02em;
  border-radius:999px;padding:5px 9px;border:1px solid #EFE1C6;background:#FFFDF6;color:#8B7767;white-space:nowrap
}
.chip.good{background:#EAF7EE;border-color:#CDEBD6;color:#3D7A55}
.chip.normal{background:#EEF6FD;border-color:#CFE5F7;color:#3F6F98}
.chip.bad{background:#FFF0E6;border-color:#F8D6BC;color:#A8632B}
.chip.verybad{background:#FFE9E9;border-color:#F6C9C9;color:#A93A3A}
.chip.gold{background:var(--gold-soft);border-color:#F2DEAD;color:var(--gold-deep)}
.chip.mint{background:var(--mint-soft);border-color:#CFEBD5;color:var(--mint-deep)}
.chip.sky{background:var(--sky-soft);border-color:#D3E7F8;color:var(--sky-deep)}
.chip.lav{background:var(--lav-soft);border-color:#E1D8F5;color:var(--lav-deep)}
.chip.pink{background:var(--pink-soft);border-color:#F8D3DC;color:var(--pink-deep)}

/* ===== family cards ===== */
.fam-wrap{
  border-radius:24px;border:1px solid #DCEEDF;
  background:linear-gradient(160deg,#F2FBF2 0%,#FAFBF0 45%,#FDF7E8 100%);
  padding:11px;box-shadow:var(--shadow);margin-bottom:13px;
}
.fam-wrap .wrap-hd{display:flex;align-items:center;gap:6px;padding:4px 6px 10px}
.fam-wrap .wrap-hd .t{font-size:15px;font-weight:800;letter-spacing:-.03em}
.fam-wrap .wrap-hd .s{font-size:11px;font-weight:700;color:#9A8875;margin-left:auto}
.fam{
  display:flex;align-items:center;gap:11px;border-radius:18px;padding:10px 12px;margin-bottom:7px;
  background:linear-gradient(180deg,#FFFEFB,#FFFAF0);border:1px solid #F3E7D0;box-shadow:var(--shadow-sm);
}
.fam:last-child{margin-bottom:0}
.fam .ava{width:52px;height:52px;flex:none;border-radius:17px;background:#fff;overflow:hidden;
  border:1px solid #F5EAD6;box-shadow:0 3px 8px rgba(180,150,110,.14)}
.fam .ava svg,.fam .ava img{width:100%;height:100%;object-fit:cover;display:block}
.fam .who{flex:1 1 auto;min-width:0}
.fam .nm{font-size:17px;font-weight:800;letter-spacing:-.03em;line-height:1.2}
.fam .sub{font-size:11px;font-weight:700;color:#A8947F;margin-top:2px}
.fam .right{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.stat{display:flex;align-items:center;gap:4px;font-size:14px;font-weight:800;letter-spacing:-.02em}
.stat .star{display:inline-flex;align-items:center;line-height:1}
.chip .star{display:inline-flex;align-items:center;margin-right:1px}
.stat.money{font-size:12px;font-weight:800;color:#B4685B}
.stat .n{font-variant-numeric:tabular-nums}
.stat.sticker{font-size:12.5px;font-weight:800;color:#B0722E;gap:2px}
.stat.sticker .n{font-size:16px;font-weight:800;color:#A9691F}
.stat.sticker .den{font-size:10.5px;font-weight:800;color:#C08C4F}
.stat.board{font-size:10.5px;font-weight:800;color:#9A8875}

/* ===== stamp board ===== */
.stamp-hd{display:flex;align-items:center;gap:8px}
.stamp-hd .t{font-size:16.5px;font-weight:800;letter-spacing:-.03em}
.streak{
  margin-left:auto;display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:800;
  color:#C0693C;background:linear-gradient(180deg,#FFF3E3,#FFE9CF);border:1px solid #F5D7AE;
  border-radius:999px;padding:5px 10px;white-space:nowrap
}
.stamp-pick{display:flex;gap:6px;margin:10px 0 4px}
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:8px}
.wk .d{display:flex;flex-direction:column;align-items:center;gap:5px}
.wk .lbl{font-size:10.5px;font-weight:800;color:#B3A08C}
.wk .lbl.sun{color:#D98A9B}
.wk .circle{
  width:100%;aspect-ratio:1/1;max-width:40px;border-radius:50%;
  border:1.6px dashed #E7D6B4;background:#FFFDF5;
  display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;cursor:pointer;
  transition:transform .15s;
}
.wk .circle:active{transform:scale(.94)}
.wk .circle.today{box-shadow:0 0 0 2px #FBE0A8, 0 0 0 4px #FFF9E8}
.wk .circle.on{border:0;background:linear-gradient(180deg,#FFE9B8,#FBD48C);box-shadow:0 3px 8px rgba(220,170,80,.28)}
.wk .circle.on.today{box-shadow:0 0 0 2px #F3C069,0 0 0 4px #FFF3D8,0 3px 8px rgba(220,170,80,.3)}
.wk .circle svg,.wk .circle img{width:96%;height:96%;object-fit:cover;border-radius:50%}
.wk .circle .tick{font-size:14px}
.stamp-foot{display:flex;gap:7px;margin-top:11px;flex-wrap:wrap}
.stamp-foot .grow{flex:1 1 120px}

/* ===== mission ===== */
.mission{position:relative;overflow:hidden}
.mission::after{
  content:"";position:absolute;right:-30px;top:-40px;width:130px;height:130px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,220,190,.55),rgba(255,220,190,0) 70%)
}
.mission-hd{display:flex;align-items:center;gap:7px;position:relative;z-index:1}
.mission-hd .t{font-size:16.5px;font-weight:800;letter-spacing:-.03em}
.mission-hd .cnt{
  margin-left:auto;font-size:11px;font-weight:800;color:#8B7767;background:#FFFDF6;
  border:1px solid #F1E3C8;border-radius:999px;padding:5px 10px;white-space:nowrap
}
.mission-body{display:flex;align-items:center;gap:12px;margin:12px 0 12px;position:relative;z-index:1}
.mission-ico{font-size:34px;line-height:1;flex:none;filter:drop-shadow(0 3px 4px rgba(200,160,90,.22))}
.mission-txt{font-size:17px;font-weight:800;letter-spacing:-.035em;line-height:1.3}
.mission-sub{font-size:11.2px;font-weight:700;color:#9A8875;margin-top:3px}
.mission-acts{display:flex;gap:8px;position:relative;z-index:1}
.mission-acts .btn{flex:1 1 0;min-width:0;font-size:13px;padding:11px 8px}
.mission.done{background:linear-gradient(180deg,#F3FBF4,#ECF8EF);border-color:#D6EDDD}

/* ===== person / todo ===== */
.person{
  border-radius:22px;padding:13px;margin-bottom:12px;border:1px solid #F1E3CA;
  background:linear-gradient(180deg,#FFFEFB,#FFFBF2);box-shadow:var(--shadow);
}
.person[data-theme="sky"]{background:linear-gradient(180deg,#F6FBFF,#EFF7FE);border-color:#D9EAF9}
.person[data-theme="mint"]{background:linear-gradient(180deg,#F5FCF6,#EDF9F0);border-color:#D6EDDC}
.person[data-theme="pink"]{background:linear-gradient(180deg,#FFF7FA,#FDEEF3);border-color:#F6DCE5}
.person[data-theme="lav"]{background:linear-gradient(180deg,#F9F7FF,#F2EFFC);border-color:#E3DCF6}
.person-hd{display:flex;align-items:center;gap:10px;padding-bottom:10px}
.person-hd .ava{width:46px;height:46px;flex:none;border-radius:15px;background:#fff;overflow:hidden;border:1px solid rgba(0,0,0,.05);box-shadow:var(--shadow-sm)}
.person-hd .ava svg,.person-hd .ava img{width:100%;height:100%;object-fit:cover}
.person-hd .nm{font-size:16.5px;font-weight:800;letter-spacing:-.03em;line-height:1.2}
.pinfo{font-size:11.2px;font-weight:700;color:#9A8875;margin-top:2px}
.person-hd .mini{margin-left:auto;display:flex;align-items:center;gap:5px;font-size:11px;font-weight:800;color:#8B7767}
.todo{border-top:1px dashed #EBDDC0;padding:9px 0;display:flex;align-items:center;gap:8px}
.todo:first-of-type{border-top:0}
.check{
  width:23px;height:23px;flex:none;border-radius:8px;border:1.8px solid #D9C7A6;background:#FFFDF6;
  display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .15s;
}
.check.on{background:linear-gradient(180deg,#7ED39A,#5FBF80);border-color:#5FBF80}
.check.on::after{content:"";width:11px;height:6px;border-left:2.4px solid #fff;border-bottom:2.4px solid #fff;transform:rotate(-45deg) translateY(-1px)}
.check:active{transform:scale(.92)}
.todo-txt{flex:1 1 auto;font-size:14px;font-weight:700;letter-spacing:-.02em;line-height:1.35;padding-right:2px}
.todo.done .todo-txt{text-decoration:line-through;color:#B5A492;font-weight:600}
.row-acts{flex:none;display:flex;gap:4px}
.mini-btn{
  width:28px;height:28px;border-radius:10px;border:1px solid #F1E4CB;background:#FFFDF7;
  display:flex;align-items:center;justify-content:center;font-size:12.5px;cursor:pointer;color:#8B7767;
}
.mini-btn:active{transform:scale(.92)}
.mini-btn.on{background:var(--gold-soft);border-color:#F0DA9F}
.mini-btn.del{color:#C46B6B}
.add-dash{
  width:100%;margin-top:10px;border-radius:15px;border:1.6px dashed #E4D3B4;background:rgba(255,255,255,.6);
  color:#A38C6F;font-size:13px;font-weight:800;padding:10px;cursor:pointer;letter-spacing:-.02em;
}
.add-dash:active{background:#FFFDF3}

/* ===== study plan card ===== */
.plan-card{padding:15px 14px 14px}
.plan-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:11px}
.plan-btn{
  display:flex;align-items:center;justify-content:center;gap:6px;min-width:0;
  border-radius:16px;border:1.4px solid #EFE2C6;background:#FFFDF7;color:#5B4634;
  font-size:13.8px;font-weight:800;letter-spacing:-.02em;padding:12px 6px;cursor:pointer;
  box-shadow:var(--shadow-sm);transition:transform .12s
}
.plan-btn:active{transform:translateY(1px)}
.plan-btn .pi{font-size:15px;line-height:1}
.plan-btn.primary{background:linear-gradient(180deg,#D9F1E0,#C2E8CE);border-color:#B2DEBF;color:#2F6B46}
.plan-meta{display:flex;align-items:center;gap:9px;margin-top:12px}
.plan-meta .prog{flex:1 1 auto;min-width:0}
.plan-meta .prog-num{flex:none}
.plan-reset{flex:none}
.plan-card .timer{margin-top:12px}
.plan-card .timer-display{font-size:46px;margin:0 0 10px}
.itag{
  display:inline-flex;align-items:center;font-size:10px;font-weight:800;letter-spacing:-.02em;
  border-radius:999px;padding:3px 7px;border:1px solid;white-space:nowrap;line-height:1.2
}
.itag.sky{background:#EAF5FE;border-color:#CDE6F9;color:#3E77A6}
.itag.lav{background:#F2EFFC;border-color:#E1D8F5;color:#6C58A8}
.itag.gold{background:#FFF6DF;border-color:#F2DEAD;color:#A8792B}
.itag.mint{background:#EAF8EF;border-color:#CDEBD6;color:#3D7A55}
.itag.pink{background:#FDEFF4;border-color:#F8D6E0;color:#B85C78}
.itag.soft{background:#F5F1E8;border-color:#EAE2D2;color:#8B7767}
.tag-chips{display:flex;flex-wrap:wrap;gap:6px}
.tagchip{
  border-radius:999px;border:1.4px solid #EBDCC0;background:#FFFDF6;color:#8B7767;
  font-size:12px;font-weight:800;padding:7px 12px;cursor:pointer;letter-spacing:-.02em
}
.tagchip.on{background:#FFF2D6;border-color:#EFD08C;color:#8A5F12;box-shadow:0 2px 6px rgba(220,180,100,.2)}
.tagbtn{
  flex:none;border-radius:999px;border:1px solid #F1E4CB;background:#FFFDF7;color:#9A8875;
  font-size:10.5px;font-weight:800;padding:5px 8px;cursor:pointer;white-space:nowrap
}
.tagbtn:active{transform:scale(.96)}
.manage-row .todo-txt{display:flex;align-items:center;gap:5px;flex-wrap:wrap}

/* ===== study ===== */
.study-top{display:flex;align-items:center;gap:8px;margin-bottom:11px}
.study-top .seg{flex:1 1 auto;min-width:0;display:flex}
.study-top .seg button{flex:1 1 0}
.study-meta{display:flex;align-items:center;gap:8px;margin:12px 0 2px}
.prog-wrap{flex:1 1 auto;min-width:0}
.prog{height:11px;border-radius:999px;background:#EFE7D6;overflow:hidden;box-shadow:inset 0 1px 2px rgba(150,120,80,.12)}
.prog > i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#8FD3F0,#7EC6E8);transition:width .35s ease}
.person[data-theme="mint"] .prog > i{background:linear-gradient(90deg,#9EE0B4,#79CE97)}
.prog-num{font-size:12px;font-weight:800;color:#5B7C93;white-space:nowrap;font-variant-numeric:tabular-nums}
.person[data-theme="mint"] .prog-num{color:#3D7A55}
.study-card .items{margin-top:9px}
.sitem{border-top:1px dashed #E9DCBF;padding:10px 0;display:flex;gap:8px;align-items:flex-start}
.sitem:first-child{border-top:0}
.sitem .check{width:22px;height:22px;border-radius:50%;margin-top:1px}
.sitem-body{flex:1 1 auto;min-width:0}
.sitem-name{font-size:14px;font-weight:700;letter-spacing:-.02em;line-height:1.35}
.sitem.done .sitem-name{text-decoration:line-through;color:#B5A492}
.sitem-tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.tag{
  font-size:10.5px;font-weight:800;border-radius:999px;padding:3px 7px;letter-spacing:-.02em;
  border:1px solid #EFE1C6;background:#FFFDF6;color:#9A8875;white-space:nowrap
}
.tag.money{background:#EAF5FE;border-color:#CDE6F9;color:#3E77A6}
.tag.sticker{background:#FFF4DA;border-color:#F3DCA4;color:#A8792B}
.tag.week{background:#FFF4E3;border-color:#F6DCB4;color:#A8632B}
.tag.week.done{background:#EAF8EF;border-color:#CDEBD6;color:#3D7A55}
.tag.pin{background:#FFF1F4;border-color:#F8D6E0;color:#BE5A76}
.tag.wkend{background:#FDEFEF;border-color:#F5D4D4;color:#B85555}
.tag.wkend.hot{background:linear-gradient(180deg,#FFE1D6,#FFD0C2);border-color:#F6BBA8;color:#A8482B;box-shadow:0 2px 6px rgba(240,140,110,.22)}
.tag.soft{background:#F4F0E8;border-color:#EAE2D2}
.sitem-acts{flex:none;display:flex;gap:3px;align-items:center;margin-top:-1px}
.tag-filter{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:2px}

/* ===== timer ===== */
.timer{
  border-radius:22px;border:1.6px dashed #CFE3F4;
  background:linear-gradient(160deg,#F7FBFF 0%,#FFFDF6 55%,#FFF8EA 100%);
  padding:14px;margin-top:13px;box-shadow:var(--shadow-sm);
}
.timer-mode{display:inline-flex;background:#F2F6FB;border:1px solid #DCE8F3;border-radius:999px;padding:3px;gap:2px}
.timer-mode button{
  border:0;background:transparent;border-radius:999px;padding:7px 14px;font-size:12.5px;font-weight:800;
  color:#8298AB;cursor:pointer;white-space:nowrap
}
.timer-mode button.on{background:#fff;color:#35597A;box-shadow:0 3px 8px rgba(120,160,200,.22)}
.timer-sub{font-size:11.5px;font-weight:700;color:#93A6B6;margin:11px 0 2px}
.timer-display{
  font-size:52px;font-weight:800;letter-spacing:-.045em;color:#2F5578;line-height:1.08;
  font-variant-numeric:tabular-nums;text-align:center;margin:2px 0 10px;
}
.timer-display.warn{color:#C4674F}
.timer-actions{display:flex;gap:8px}
.timer-actions .btn{flex:1 1 0;padding:12px 8px;font-size:14px}
.presets{display:flex;gap:7px;align-items:center;margin-top:10px;flex-wrap:wrap}
.preset{
  border-radius:999px;border:1.4px solid #DCE8F3;background:#FFFDF7;color:#4E7B9F;font-size:12.5px;
  font-weight:800;padding:7px 14px;cursor:pointer
}
.preset.on{background:#EAF4FD;border-color:#BEDCF3;color:#2F628C;box-shadow:0 2px 6px rgba(120,160,200,.18)}
.preset.gold{border-color:#F0DEB4;background:#FFFDF5;color:#A8792B}
.preset.gold.on{background:#FFF3D8;border-color:#EFCF8A;color:#8A5F12;box-shadow:0 2px 6px rgba(220,180,100,.22)}
.custom-row{display:flex;gap:6px;align-items:center;margin-top:9px}
.custom-row input{
  flex:1 1 auto;min-width:0;border-radius:13px;border:1.4px solid #E4E0D2;background:#FFFEF8;
  padding:9px 11px;font-size:13px;font-weight:700;outline:none;text-align:center
}
.custom-row input:focus{border-color:#C8DDF0;box-shadow:0 0 0 3px rgba(200,225,245,.4)}

/* ===== sticker board ===== */
.stk-card{
  border-radius:24px;border:1px solid #F3DEC2;
  background:linear-gradient(140deg,#FFF7E3 0%,#FFF3F4 55%,#F8F1FE 100%);
  padding:15px;box-shadow:var(--shadow);margin-bottom:13px;position:relative;overflow:hidden
}
.stk-card[data-kid="han"]{background:linear-gradient(140deg,#F2FBF1 0%,#FFFDF2 52%,#FDF3F6 100%);border-color:#DCEEDD}
.stk-hd{display:flex;align-items:center;gap:9px}
.stk-hd .ava{width:44px;height:44px;border-radius:14px;overflow:hidden;background:#fff;border:1px solid #F0E0C6;box-shadow:var(--shadow-sm);flex:none}
.stk-hd .ava svg,.stk-hd .ava img{width:100%;height:100%;object-fit:cover}
.stk-hd .t{font-size:15.5px;font-weight:800;letter-spacing:-.03em}
.stk-hd .s{font-size:11px;font-weight:700;color:#A89279;margin-top:2px}
.stk-boards{
  margin-left:auto;flex:none;font-size:11.5px;font-weight:800;color:#8A5F12;
  background:linear-gradient(180deg,#FFEFC8,#FBE0A6);border:1px solid #F2D18C;border-radius:999px;
  padding:6px 10px;white-space:nowrap;box-shadow:0 2px 6px rgba(220,180,100,.2)
}
.stk-mid{display:flex;align-items:flex-end;gap:10px;margin-top:12px}
.stk-big{font-size:34px;font-weight:800;letter-spacing:-.05em;color:#B0722E;line-height:1;font-variant-numeric:tabular-nums}
.stk-big span{font-size:15px;font-weight:800;color:#C08C4F;margin-left:4px;letter-spacing:-.02em}
.stk-side{margin-left:auto;text-align:right;font-size:11px;font-weight:700;color:#9A8875;line-height:1.6}
.stk-side b{color:#6B5540;font-weight:800}
.stk-bar{height:13px;border-radius:999px;background:#F3E9D5;overflow:hidden;margin-top:10px;box-shadow:inset 0 1px 2px rgba(150,120,80,.12)}
.stk-bar>i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#FFD771,#F5B840);transition:width .4s ease}
.stk-card[data-kid="han"] .stk-bar>i{background:linear-gradient(90deg,#A8E5B8,#6FCB8B)}
.stk-note{font-size:11px;font-weight:700;color:#9A8875;margin-top:8px;line-height:1.55}
.stk-note b{color:#6B5540;font-weight:800}
.stk-full{
  margin-top:11px;border-radius:18px;border:1.6px dashed #F0C879;background:linear-gradient(180deg,#FFF9E8,#FFF1CB);
  padding:12px;text-align:center;animation:pop .35s ease both
}
.stk-full .t{font-size:15px;font-weight:800;letter-spacing:-.03em;color:#8A5F12}
.stk-full .s{font-size:11.2px;font-weight:700;color:#A89279;margin:3px 0 9px}
.stk-acts{display:flex;gap:7px;margin-top:10px}
.stk-acts .btn{flex:1 1 0;min-width:0;font-size:12.9px;padding:11px 6px;letter-spacing:-.035em;line-height:1.25}
.stk-chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:9px}
.board-hd{display:flex;align-items:center;gap:6px}
.board-hd .t{font-size:15px;font-weight:800;letter-spacing:-.03em}
.board-hd .bd-count{
  margin-left:auto;font-size:11.5px;font-weight:800;color:#8A5F12;background:#FFF5DC;
  border:1px solid #F2DEAD;border-radius:999px;padding:4px 9px;white-space:nowrap;font-variant-numeric:tabular-nums
}
.board{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:11px}
.scell{
  aspect-ratio:1/1;border-radius:13px;border:1.5px dashed #EADCC0;background:#FFFDF7;
  display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden
}
.scell .no{font-size:11px;font-weight:800;color:#DCCDB4;font-variant-numeric:tabular-nums}
.scell.on{border:1px solid #F1D79A;background:linear-gradient(180deg,#FFF8E6,#FFEDC6);box-shadow:0 2px 6px rgba(210,170,90,.16)}
.scell.on .face{display:block;width:84%;height:84%;border-radius:50%;overflow:hidden;background:#FFFDF6}
.scell.on .face svg{width:100%;height:100%;display:block}
.scell.on .face.photo{background-image:var(--stamp);background-size:cover;background-position:center;background-repeat:no-repeat}
.scell.on .ok{
  position:absolute;right:2px;bottom:2px;width:15px;height:15px;border-radius:50%;
  background:linear-gradient(180deg,#7FD08F,#5FBF80);border:1.5px solid #FFFDF7;
  display:flex;align-items:center;justify-content:center
}
.scell.on .ok::after{content:"";width:6px;height:3.4px;border-left:1.7px solid #fff;border-bottom:1.7px solid #fff;transform:rotate(-45deg) translateY(-1px)}
.stk-board-card[data-kid="han"] .scell.on{border-color:#CBE7D2;background:linear-gradient(180deg,#F4FCF5,#E6F6EA)}
.celebrate{text-align:center;padding:8px 0 2px}
.celebrate .big{font-size:46px;line-height:1.1}
.celebrate .t{font-size:16.5px;font-weight:800;letter-spacing:-.03em;margin-top:6px}
.celebrate .s{font-size:11.8px;font-weight:700;color:#9A8875;margin-top:5px;line-height:1.65}

/* ===== chat ===== */
.chat-wrap{display:flex;flex-direction:column;gap:10px}
.chat-hd{txt-align:left}
.me-row{display:flex;gap:6px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.me-row::-webkit-scrollbar{display:none}
.me{
  flex:none;display:flex;align-items:center;gap:6px;border-radius:999px;border:1.4px solid #EFE2C8;
  background:#FFFDF6;padding:5px 11px 5px 5px;font-size:12.5px;font-weight:800;color:#8B7767;cursor:pointer;
  white-space:nowrap;box-shadow:var(--shadow-sm)
}
.me .ava{width:26px;height:26px;border-radius:50%;overflow:hidden;background:#fff;flex:none}
.me .ava svg,.me .ava img{width:100%;height:100%;object-fit:cover}
.me.on{border-color:#9FCBE8;background:#F4FBFF;color:#35597A;box-shadow:0 3px 10px rgba(120,170,210,.22)}
.me-row-label{font-size:11px;font-weight:800;color:#A89279;margin:2px 0 4px}

.msgs{
  min-height:300px;
  min-height:max(300px, calc(100dvh - 400px));display:flex;flex-direction:column;gap:13px;padding:14px 13px 16px;
  border-radius:22px;border:1px solid var(--line);
  background:linear-gradient(180deg,#FFFDF6,#FFF9EC);box-shadow:var(--shadow)
}
.msg{display:flex;gap:8px;align-items:flex-start;max-width:100%;animation:pop .2s ease both}
.msg .ava{margin-top:15px}
.msg .ava{width:32px;height:32px;border-radius:12px;overflow:hidden;background:#fff;border:1px solid #F4E9D5;flex:none;box-shadow:var(--shadow-sm)}
.msg .ava svg,.msg .ava img{width:100%;height:100%;object-fit:cover}
.msg .body{min-width:0;max-width:78%}
.msg .who{font-size:10.5px;font-weight:800;color:#A89279;margin:0 0 4px 2px}
.bubble{
  font-size:13.8px;font-weight:600;line-height:1.5;letter-spacing:-.015em;
  padding:10px 13px;border-radius:16px 16px 16px 5px;background:#fff;border:1px solid #F2E6D0;
  box-shadow:var(--shadow-sm);white-space:pre-wrap;word-break:break-word
}
.msg.mine{flex-direction:row-reverse}
.msg.mine .body{max-width:80%}
.msg.mine .bubble{background:linear-gradient(180deg,#EAF5FE,#E1F0FC);border-color:#CFE5F7;border-radius:16px 16px 5px 16px}
.msg.mine .who{text-align:right;margin-right:2px}
.msg.mine .hearts{justify-content:flex-end}
.sticker-card{
  background:#fff;border:1px solid #F2E6D0;border-radius:18px;padding:8px 10px 9px;
  box-shadow:var(--shadow-sm);display:flex;flex-direction:column;align-items:center;gap:2px;width:96px
}
.sticker-card .stk{font-size:30px;line-height:1.1}
.sticker-card .stk-ava{width:44px;height:44px;border-radius:50%;overflow:hidden;border:1px solid rgba(0,0,0,.04)}
.sticker-card .stk-ava svg,.sticker-card .stk-ava img{width:100%;height:100%;object-fit:cover}
.sticker-card .lb{font-size:10.5px;font-weight:800;color:#8B7767}
.hearts{display:flex;gap:5px;margin-top:5px;align-items:center}
.heart-btn{
  display:inline-flex;align-items:center;gap:3px;border-radius:999px;border:1px solid #F3E1E6;background:#FFFDF8;
  font-size:10.5px;font-weight:800;color:#B0768A;padding:3px 8px;cursor:pointer
}
.heart-btn.on{background:#FFEFF3;border-color:#F6CBD8;color:#C74E6C}
.chat-empty{font-size:12px;font-weight:700;color:#B5A492;text-align:center;padding:26px 0}

.composer{
  position:fixed;left:0;right:0;margin:0 auto;bottom:calc(var(--dock) + 66px + env(safe-area-inset-bottom));
  width:100%;max-width:430px;padding:8px 12px;display:flex;gap:7px;align-items:center;
  background:linear-gradient(180deg,rgba(255,249,235,.6),rgba(255,249,235,.97) 40%);border-top:1px solid #F3E6CD;z-index:30
}
.composer[hidden]{display:none}
.composer input[type=text]{
  flex:1 1 auto;min-width:0;border-radius:16px;border:1.4px solid #EDDFC4;background:#FFFEF9;
  padding:11px 13px;font-size:13.5px;font-weight:600;outline:none
}
.composer input[type=text]:focus{border-color:#F0D3AA;box-shadow:0 0 0 3px rgba(250,225,180,.35)}
.composer .send{
  flex:none;width:44px;height:42px;border-radius:15px;border:1px solid #F2B4C5;
  background:linear-gradient(180deg,#FCDCE5,#F8C6D4);color:#9C3B57;font-size:16px;cursor:pointer;box-shadow:var(--shadow-sm)
}
.composer .sticker-toggle{
  flex:none;width:42px;height:42px;border-radius:15px;border:1px solid #EDDFC4;background:#FFFDF6;font-size:17px;cursor:pointer
}
.sticker-panel{
  display:none;position:fixed;left:0;right:0;margin:0 auto;bottom:calc(var(--dock) + 122px + env(safe-area-inset-bottom));
  width:100%;max-width:430px;padding:0 12px;z-index:31
}
.sticker-panel.open{display:block;animation:panelIn .2s ease both}
.sticker-grid{
  background:#FFFDF6;border:1px solid var(--line);border-radius:20px;padding:10px;
  display:grid;grid-template-columns:repeat(3,1fr);gap:7px;box-shadow:0 14px 30px rgba(150,120,80,.2)
}
.sticker-pick{
  border:1px solid #F2E6D0;background:#fff;border-radius:14px;padding:8px 4px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:2px
}
.sticker-pick .e{font-size:24px;line-height:1.1}
.sticker-pick .l{font-size:10px;font-weight:800;color:#8B7767}
.sticker-pick:active{background:#FFF7E7}

/* ===== nav ===== */
.nav{
  position:fixed;left:0;right:0;bottom:var(--dock);margin:0 auto;width:100%;max-width:430px;
  display:grid;grid-template-columns:repeat(5,1fr);gap:2px;
  padding:7px 8px calc(7px + env(safe-area-inset-bottom));
  background:rgba(255,252,243,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-top:1px solid #F1E3C8;z-index:40
}
@media(min-width:520px){.nav{border-radius:0 0 34px 34px}}
.nav button{
  border:0;background:transparent;border-radius:15px;padding:6px 2px 5px;display:flex;flex-direction:column;
  align-items:center;gap:2px;cursor:pointer;color:#A8947F;transition:background .18s,color .18s
}
.nav .ico{font-size:19px;line-height:1.1;filter:saturate(.85)}
.nav .lb{font-size:10px;font-weight:800;letter-spacing:-.03em}
.nav button.on{background:linear-gradient(180deg,#FFF1CE,#FFE7B4);color:#8A5F12;box-shadow:0 4px 12px rgba(230,190,110,.28)}
.nav button.on .ico{filter:none;transform:translateY(-1px)}

/* ===== modal ===== */
.modal{position:fixed;inset:0;background:rgba(70,52,34,.34);backdrop-filter:blur(2px);z-index:70;display:flex;align-items:flex-end;justify-content:center}
.modal[hidden]{display:none}
.sheet{
  width:100%;max-width:430px;max-height:88vh;overflow:auto;background:#FFFCF3;
  border-radius:26px 26px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom));
  box-shadow:0 -10px 40px rgba(120,95,60,.24);animation:sheetUp .24s ease both
}
@media(min-width:520px){.sheet{border-radius:26px}}
.sheet-hd{display:flex;align-items:center;gap:8px;margin-bottom:6px;position:sticky;top:-16px;background:#FFFCF3;padding:4px 0 8px;z-index:1}
.sheet-hd .t{font-size:17px;font-weight:800;letter-spacing:-.03em}
.sheet-hd .x{margin-left:auto;width:32px;height:32px;border-radius:50%;border:1px solid #F0E2C8;background:#fff;cursor:pointer;font-size:14px;color:#9A8875}
.sheet-sec{border-top:1px dashed #EBDDC0;padding:13px 0 3px;margin-top:6px}
.sheet-sec:first-of-type{border-top:0;margin-top:0}
.sheet-sec .st{font-size:13.5px;font-weight:800;letter-spacing:-.02em;margin-bottom:7px;display:flex;align-items:center;gap:6px}
.field{width:100%;border-radius:14px;border:1.4px solid #E9DCC3;background:#FFFEF8;padding:11px 12px;font-size:14px;font-weight:700;outline:none}
.field:focus{border-color:#F0CE9E;box-shadow:0 0 0 3px rgba(250,220,170,.35)}
textarea.field{min-height:92px;resize:vertical;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;font-weight:600;line-height:1.5;letter-spacing:.01em}
.sheet-acts{display:flex;gap:7px;margin-top:11px}
.sheet-acts .btn{flex:1 1 0}
.ava-picks{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:4px}
.ava-pick{border:1px solid #F1E4CB;background:#fff;border-radius:16px;padding:7px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer}
.ava-pick .ava{width:48px;height:48px;border-radius:14px;overflow:hidden;background:#FFF8E7}
.ava-pick .ava svg,.ava-pick .ava img{width:100%;height:100%;object-fit:cover}
.ava-pick .n{font-size:10.5px;font-weight:800;color:#8B7767}
.ava-pick .u{font-size:9.5px;font-weight:800;color:var(--pink-deep)}
.kv{display:flex;gap:6px;font-size:11.5px;font-weight:700;color:#8B7767;padding:5px 0;justify-content:space-between;border-bottom:1px dashed #F2E7D2}
.kv b{font-weight:800;color:#5B4634}
.kv:last-child{border-bottom:0}

/* ===== calendar ===== */
.cal-hd{display:flex;align-items:center;gap:8px;margin:4px 0 10px}
.cal-hd .m{font-size:15.5px;font-weight:800;letter-spacing:-.02em}
.cal-hd .nav-btns{margin-left:auto;display:flex;gap:5px}
.cal-dow{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:5px}
.cal-dow span{font-size:10.5px;font-weight:800;color:#B3A08C;text-align:center}
.cal-dow span.sun{color:#D98A9B}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-cell{
  aspect-ratio:1/1;border-radius:12px;border:1px solid #F4E9D6;background:#FFFDF7;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;cursor:pointer;
  font-size:10.5px;font-weight:800;color:#A8947F;padding:1px;overflow:hidden
}
.cal-cell.empty{border:0;background:transparent;cursor:default}
.cal-cell .dnum{font-size:10px;line-height:1;font-weight:800;color:#B6A594}
.cal-cell.on{background:linear-gradient(180deg,#FFEDC6,#FBDCA0);border-color:#F3CE89}
.cal-cell.on .dnum{color:#8A5F12}
.cal-cell.today{box-shadow:0 0 0 2px #FBE0A8 inset}
.cal-cell .mini{width:70%;aspect-ratio:1/1;border-radius:50%;overflow:hidden;display:flex;align-items:center;justify-content:center}
.cal-cell .mini svg,.cal-cell .mini img{width:100%;height:100%;object-fit:cover}
.cal-foot{display:flex;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap}
.cal-stat{font-size:11.5px;font-weight:800;color:#8B7767}

/* ===== toast ===== */
.toast{
  position:fixed;left:50%;transform:translate(-50%,10px);bottom:calc(var(--dock) + 112px + env(safe-area-inset-bottom));
  background:rgba(74,56,40,.94);color:#FFF8E9;font-size:12.5px;font-weight:800;letter-spacing:-.02em;
  padding:11px 16px;border-radius:14px;z-index:90;opacity:0;pointer-events:none;transition:all .25s ease;
  box-shadow:0 8px 22px rgba(60,44,30,.28);max-width:88%;text-align:center;line-height:1.4
}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ===== misc ===== */
.empty{font-size:12px;font-weight:700;color:#B5A492;text-align:center;padding:16px 0;line-height:1.6}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.inline-row{display:flex;align-items:center;gap:7px}
.grow{flex:1 1 auto;min-width:0}
.nowrap{white-space:nowrap}
.small{font-size:11px;font-weight:700;color:#9A8875}

/* 가족 실시간 동기화 상태 배지 */
.sync-row{display:flex;margin-top:7px}
.sync-pill{
  display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:800;line-height:1;
  padding:5px 10px;border-radius:999px;border:1px solid #F2E3C4;color:#8A6A2E;
  background:linear-gradient(180deg,#FFFDF4,#FFF7E4);transition:background .2s,color .2s,border-color .2s
}
.sync-pill.live{background:linear-gradient(180deg,#F2FCF5,#E6F8EC);border-color:#C4E8D1;color:#2F7C4C}
.sync-pill.poll{background:linear-gradient(180deg,#F4FAFF,#E9F3FE);border-color:#C8DEF5;color:#2C5F8A}

<body>
<div class="app">
  <header class="top">
    <div class="title-row">
      <span class="logo" id="logo" aria-hidden="true"></span>
      <h1>우리 가족 기록장</h1>
      <div class="top-actions">
        <button class="iconbtn has-dot" id="btnSettings" data-act="open-settings" aria-label="설정">⚙️</button>
      </div>
    </div>
    <div class="meta-row">
      <div class="date-col">
        <div class="date-line" id="todayLine">오늘</div>
        <div class="hello">우리집의 포근한 하루</div>
      </div>
      <div class="note-pill">✨ 오늘도 함께 기록해요</div>
    </div>
    <div class="sync-row"><div class="sync-pill start" id="syncPill" aria-live="polite">🟡 가족 동기화 연결 중…</div></div>
  </header>

  <main>
    <section class="screen active" id="screen-home"><div id="homeRoot"></div></section>
    <section class="screen" id="screen-todo"><div id="todoRoot"></div></section>
    <section class="screen" id="screen-study"><div id="studyRoot"></div></section>
    <section class="screen" id="screen-sticker"><div id="stickerRoot"></div></section>
    <section class="screen" id="screen-chat">
      <div class="card chat-hd" style="margin-bottom:10px">
        <div class="sec-title"><span class="em">💬</span>우리 가족 채팅</div>
        <div class="hint" style="margin-top:5px">율·한·엄마·아빠가 말풍선과 스티커로 이야기해요 · 하트로 마음을 전해요</div>
      </div>
      <div id="meRow"></div>
      <div class="msgs" id="msgList"></div>
      <div style="height:72px"></div>
    </section>
  </main>
</div>

<nav class="nav" id="nav">
  <button data-act="tab" data-id="home" class="on"><span class="ico">🏠</span><span class="lb">홈</span></button>
  <button data-act="tab" data-id="todo"><span class="ico">✅</span><span class="lb">할일</span></button>
  <button data-act="tab" data-id="study"><span class="ico">📚</span><span class="lb">공부</span></button>
  <button data-act="tab" data-id="sticker"><span class="ico">⭐</span><span class="lb">스티커</span></button>
  <button data-act="tab" data-id="chat"><span class="ico">💬</span><span class="lb">가족톡</span></button>
</nav>

<div class="composer" id="composer" hidden>
  <button class="sticker-toggle" data-act="sticker-toggle" aria-label="스티커">😊</button>
  <input type="text" id="chatInput" placeholder="하고 싶은 말을 적어 보세요" maxlength="300" autocomplete="off">
  <button class="send" data-act="chat-send" aria-label="보내기">➤</button>
</div>

<div class="sticker-panel" id="stickerPanel">
  <div class="sticker-grid" id="stickerGrid"></div>
</div>

<div class="modal" id="modal" hidden><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>
<input type="file" id="photoInput" accept="image/*" hidden>

const TAGS = ['영어', '수학', '한자', '인강', '주말', '연산', '한글', '기타'];
const TAG_TONES = ['sky', 'lav', 'gold', 'mint', 'pink', 'sky', 'mint', 'soft'];
function tagTone(tag) {
  const i = TAGS.indexOf(tag);
  if (i >= 0) return TAG_TONES[i];
  let h = 0;
  for (let k = 0; k < tag.length; k++) h = (h * 31 + tag.charCodeAt(k)) % 6;
  return ['sky', 'lav', 'gold', 'mint', 'pink', 'soft'][h];
}
function guessTag(text) {
  const t = String(text || '');
  if (t.indexOf('영어') >= 0) return '영어';
  if (t.indexOf('수학') >= 0) return '수학';
  if (t.indexOf('한자') >= 0) return '한자';
  if (t.indexOf('인강') >= 0) return '인강';
  if (t.indexOf('주말') >= 0) return '주말';
  if (t.indexOf('연산') >= 0) return '연산';
  if (t.indexOf('한글') >= 0 || t.indexOf('하.삼') >= 0) return '한글';
  return '';
}

const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.prototype.slice.call((r || document).querySelectorAll(s));

function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function ymd(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const dd = String(d.getDate()).padStart(2, '0');
  return y + '-' + m + '-' + dd;
}
function TODAY() { return ymd(new Date()); }
function parseYmd(s) { const p = String(s).split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); }
function weekStartKey(d) {
  const x = new Date(d || new Date());
  x.setDate(x.getDate() - ((x.getDay() + 6) % 7));
  x.setHours(0, 0, 0, 0);
  return ymd(x);
}
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function kdate(d) { return (d.getMonth() + 1) + '월 ' + d.getDate() + '일 ' + DAY_KR[d.getDay()] + '요일'; }
function hm(ts) {
  const d = new Date(ts);
  let h = d.getHours();
  const ap = h < 12 ? '오전' : '오후';
  h = h % 12 || 12;
  return ap + ' ' + h + ':' + String(d.getMinutes()).padStart(2, '0');
}
function dateLabel(key) {
  if (!key) return '';
  const t = TODAY();
  const y = new Date(); y.setDate(y.getDate() - 1);
  if (key === t) return '오늘';
  if (key === ymd(y)) return '어제';
  const p = key.split('-');
  return Number(p[1]) + '월 ' + Number(p[2]) + '일';
}
function name(id) { return (state.members[id] && state.members[id].name) || MEMBERS[id].name; }

function todoItem(text) { return { id: uid(), text: text, done: false, doneDate: null }; }
function studyItem(text, count, opt) {
  opt = opt || {};

    id: uid(), text: text, count: Math.max(1, Number(count) || 1), tag: opt.tag || guessTag(text),
    pinned: opt.pinned !== false, doneDate: null,
    weeklyGoal: opt.weeklyGoal || 0, weekDays: [], weekend: !!opt.weekend

}

let storageOk = true;
let localExisted = true;   /* 이 기기에 이미 기록이 있었는지 (새 기기면 서버 기록을 먼저 받아 옵니다) */
function loadState() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (!raw) { localExisted = false; return defaultState(); }
    return migrate(JSON.parse(raw));
  } catch (e) {
    if (e && e.name === 'SecurityError') storageOk = false;
    return defaultState();
  }
}
function migrate(s) {
  const d = defaultState();
  const out = Object.assign({}, d, s || {});
  out.version = 2;
  out.ui = Object.assign({}, d.ui, (s && s.ui) || {});
  if (out.ui.tab === 'money') out.ui.tab = 'sticker';
  if (!out.ui.stickerChild && s && s.ui && s.ui.moneyChild) out.ui.stickerChild = s.ui.moneyChild;
  if (KIDS.indexOf(out.ui.stickerChild) < 0) out.ui.stickerChild = 'yul';
  out.members = {};
  ORDER.forEach(id => {
    out.members[id] = Object.assign({ name: MEMBERS[id].name, photo: PHOTOS[id] }, (s && s.members && s.members[id]) || {});
    if (!out.members[id].photo) out.members[id].photo = PHOTOS[id];
  });
  out.todos = Object.assign({}, d.todos, (s && s.todos) || {});
  out.study = Object.assign({}, d.study, (s && s.study) || {});
  out.stickers = {};
  KIDS.forEach(k => {
    const src = (s && s.stickers && s.stickers[k]) || {};
    const entries = Array.isArray(src.entries) ? src.entries : [];
    out.stickers[k] = {
      boards: Math.max(0, parseInt(src.boards, 10) || 0),
      entries: entries.filter(e => e && typeof e === 'object').map(e => ({
        id: e.id || uid(),
        n: Math.round(Number(e.n) || 0),
        kind: e.kind === 'study' || e.kind === 'bonus' || e.kind === 'take' ? e.kind : 'bonus',
        itemId: e.itemId || null, itemText: e.itemText || '',
        memo: e.memo || '', date: e.date || TODAY(), at: Number(e.at) || 0
      }))
    };
  });
  delete out.allowance;
  out.stamps = Object.assign({ yul: {}, han: {} }, (s && s.stamps) || {});
  out.chat = Object.assign({ messages: [] }, (s && s.chat) || {});
  if (!Array.isArray(out.chat.messages)) out.chat.messages = [];
  out.mission = Object.assign({ date: TODAY(), id: 'dinner', doneCount: 0 }, (s && s.mission) || {});
  ORDER.forEach(id => {
    if (!Array.isArray(out.todos[id] || null)) out.todos[id] = d.todos[id] || [];
    if (KIDS.indexOf(id) >= 0) {
      if (!Array.isArray(out.study[id])) out.study[id] = d.study[id] || [];
      out.study[id] = out.study[id].map(it => {
        const next = Object.assign({ weekDays: [] }, it);
        const c = parseInt(next.count, 10);
        next.count = (!isNaN(c) && c >= 1 ? Math.min(50, c) : 1);
        if (typeof next.tag !== 'string' || !next.tag) next.tag = guessTag(next.text);
        delete next.amount;
        return next;
      });
    }
  });
  return out;
}
function persist() {
  state.savedAt = new Date().toISOString();
  try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); storageOk = true; }
  catch (e) { storageOk = false; }
}
function save() {
  persist();
  /* 이 기기에 먼저 저장한 뒤, 가족 클라우드에도 조용히 올립니다 (오프라인이면 자동으로 나중에) */
  queueSync();
}

function rollover() {
  const t = TODAY();
  if (state.lastOpen !== t) {
    KIDS.forEach(k => (state.study[k] || []).forEach(it => { it.doneDate = null; }));
    ORDER.forEach(id => (state.todos[id] || []).forEach(td => { td.done = false; td.doneDate = null; }));
    state.lastOpen = t;
  }
  const ws = weekStartKey();
  KIDS.forEach(k => (state.study[k] || []).forEach(it => {
    if (it.weeklyGoal) it.weekDays = (it.weekDays || []).filter(d => weekStartKey(parseYmd(d)) === ws);
  }));
  if (state.mission.date !== t) {
    state.mission = { date: t, id: randomMission(''), doneCount: 0 };
  }
}
function randomMission(exclude) {
  const pool = MISSIONS.filter(m => m.id !== exclude);
  return pool[Math.floor(Math.random() * pool.length)].id;
}

function avatar(id) {
  const m = state.members[id];
  if (m && m.photo) return '<img src="' + m.photo + '" alt="' + esc(name(id)) + '">';
  return CHARS[id] || '';
}
function sumKind(kid, kind) {
  return (stickerState(kid).entries || []).reduce((s, e) => s + (e.kind === kind ? Math.abs(Number(e.n) || 0) : 0), 0);
}
/* ---- 칭찬스티커 계산 ---- */
function stickerState(kid) {
  if (!state.stickers) state.stickers = {};
  if (!state.stickers[kid]) state.stickers[kid] = { boards: 0, entries: [] };
  const st = state.stickers[kid];
  if (!Array.isArray(st.entries)) st.entries = [];
  st.boards = Math.max(0, parseInt(st.boards, 10) || 0);
  return st;
}
function stickerTotal(kid) {
  return (stickerState(kid).entries || []).reduce((s, e) => s + (Number(e.n) || 0), 0);
}
function stickerBoards(kid) { return stickerState(kid).boards; }
function boardFilled(kid) {
  return Math.min(50, Math.max(0, stickerTotal(kid) - stickerBoards(kid) * 50));
}
function boardLeft(kid) { return Math.max(0, 50 - boardFilled(kid)); }
function boardFull(kid) { return boardFilled(kid) >= 50; }
function todaySticker(kid) {
  const t = TODAY();
  return (stickerState(kid).entries || []).reduce((s, e) => s + (e.date === t ? Number(e.n) || 0 : 0), 0);
}
function signed(n) { return (n > 0 ? '+' : '') + n; }
function todayDoneCount(id) {
  let n = (state.todos[id] || []).filter(t => t.done).length;
  if (KIDS.indexOf(id) >= 0) n += (state.study[id] || []).filter(i => i.doneDate === TODAY()).length;
  return n;
}
function weekDone(it) {
  const ws = weekStartKey();
  return (it.weekDays || []).filter(d => weekStartKey(parseYmd(d)) === ws).length;
}
function markStamp(kid) {
  if (KIDS.indexOf(kid) < 0) return;
  state.stamps[kid] = state.stamps[kid] || {};
  state.stamps[kid][TODAY()] = true;
}
function streakOf(kid) {
  const st = state.stamps[kid] || {};
  let n = 0;
  const d = new Date();
  if (!st[ymd(d)]) d.setDate(d.getDate() - 1);
  while (st[ymd(d)]) { n++; d.setDate(d.getDate() - 1); }
  return n;
}
function countMonth(kid, y, m) {
  const st = state.stamps[kid] || {};
  const pre = y + '-' + String(m).padStart(2, '0');
  return Object.keys(st).filter(k => k.indexOf(pre) === 0).length;
}
function mondayToSunday() {
  const d = new Date();
  const base = new Date(d);
  base.setDate(base.getDate() - ((d.getDay() + 6) % 7));
  const arr = [];
  for (let i = 0; i < 7; i++) {
    const x = new Date(base);
    x.setDate(base.getDate() + i);
    arr.push(x);
  }
  return arr;
}

function fmtClock(sec) {
  const mm = String(Math.floor(sec / 60)).padStart(2, '0');
  const ss = String(sec % 60).padStart(2, '0');
  return mm + ':' + ss;
}
function timerHTML() {
  const label = timer.mode === 'left'
    ? (timer.running ? timer.minutes + '분 중 ' + fmtClock(timer.remaining) + ' 남았어요'
      : (timer.remaining < timer.minutes * 60 ? timer.minutes + '분 · 이어서 시작할 수 있어요' : timer.minutes + '분 · 시작을 눌러요'))
    : (timer.running ? '시간을 재는 중이에요 ⏱️' : '시작을 누르면 시간을 재요');
  return '<div class="timer plan-timer">' +
    '<div class="inline-row">' +
    '<div class="timer-mode">' +
    '<button class="' + (timer.mode === 'left' ? 'on' : '') + '" data-act="timer-mode" data-mode="left">⏳ 남은 시간</button>' +
    '<button class="' + (timer.mode === 'up' ? 'on' : '') + '" data-act="timer-mode" data-mode="up">⏱️ 재는 시간</button>' +
    '</div><span class="small" style="margin-left:auto">⏳ 집중 타이머</span></div>' +
    '<div class="timer-sub" id="timerSub">' + label + '</div>' +
    '<div class="timer-display" id="timerDisplay">' + fmtClock(timer.mode === 'left' ? timer.remaining : timer.elapsed) + '</div>' +
    '<div class="timer-actions">' +
    '<button class="btn ' + (timer.running ? 'gold' : 'primary') + '" id="timerStartBtn" data-act="timer-start">' + (timer.running ? '⏸ 잠깐 멈춤' : '▶ 시작') + '</button>' +
    '<button class="btn" data-act="timer-reset">↺ 초기화</button></div>' +
    '<div class="presets">' + [10, 20, 30].map(m =>
      '<button class="preset ' + (timer.minutes === m ? 'on' : '') + '" data-act="timer-set" data-min="' + m + '">' + m + '분</button>').join('') +
    '<span class="small" style="margin-left:auto">' + timer.minutes + '분 맞춰져 있어요</span></div>' +
    '<div class="custom-row"><input id="customMin" type="number" inputmode="numeric" min="1" max="180" placeholder="직접" aria-label="직접 몇 분">' +
    '<button class="btn sm" data-act="timer-custom">분 맞추기</button></div>' +
    '</div>';
}
function paintTimer() {
  const d = $('#timerDisplay');
  if (!d) return;
  const sec = timer.mode === 'left' ? Math.max(0, timer.remaining) : timer.elapsed;
  d.textContent = fmtClock(sec);
  d.classList.toggle('warn', timer.mode === 'left' && timer.running && timer.remaining <= 30 && timer.remaining > 0);
  const sub = $('#timerSub');
  if (sub) {
    sub.textContent = timer.mode === 'left'
      ? (timer.running ? timer.minutes + '분 중 ' + fmtClock(timer.remaining) + ' 남았어요'
        : (timer.remaining < timer.minutes * 60 ? timer.minutes + '분 · 이어서 시작할 수 있어요' : timer.minutes + '분 · 시작을 눌러요'))
      : (timer.running ? '시간을 재는 중이에요 ⏱️' : '시작을 누르면 시간을 재요');
  }
  const b = $('#timerStartBtn');
  if (b) { b.textContent = timer.running ? '⏸ 잠깐 멈춤' : '▶ 시작'; b.className = 'btn ' + (timer.running ? 'gold' : 'primary'); }
}
function startTick() {
  if (tickId) return;
  tickId = setInterval(function () {
    if (timer.mode === 'left') {
      timer.remaining = Math.max(0, timer.remaining - 1);
      if (timer.remaining === 0) { pauseTimer(); timerHit = false; toast('⏰ 시간 다 됐어요! 정말 잘했어요 👏'); }
    } else {
      timer.elapsed++;
      if (timer.minutes > 0 && timer.elapsed === timer.minutes * 60 && !timerHit) {
        timerHit = true;
        toast('⏰ ' + timer.minutes + '분 채웠어요! 공부 하나 체크해 볼까요?');
      }
    }
    paintTimer();
  }, 1000);
}
function pauseTimer() {
  timer.running = false;
  if (tickId) { clearInterval(tickId); tickId = null; }
  paintTimer();
}
function startTimer() {
  if (timer.mode === 'left' && timer.remaining === 0) timer.remaining = timer.minutes * 60;
  timer.running = true;
  timerHit = false;
  startTick();
  paintTimer();
}

  const to = setTimeout(function () { if (wx.status !== 'ok') { wx = { status: 'error' }; if (state.ui.tab === 'home') renderHome(); } }, 6000);

    .then(r => { if (!r.ok) throw new Error('http ' + r.status); return r.json(); })

function encodeState() {
  try {
    /* 기본 캐릭터 사진은 코드에 이미 들어 있으니 동기화 코드에서는 빼서 짧게 유지 */
    const copy = JSON.parse(JSON.stringify(state));
    ORDER.forEach(id => {
      if (copy.members && copy.members[id] && copy.members[id].photo === PHOTOS[id]) copy.members[id].photo = '';
    });
    const bytes = new TextEncoder().encode(JSON.stringify(copy));
    let bin = '';
    for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
    return 'FL1-' + btoa(bin);
  } catch (e) { return ''; }
}
function decodeState(code) {
  const raw = String(code || '').trim().replace(/\s+/g, '').replace(/^FL1-/, '');
  const bin = atob(raw);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return JSON.parse(new TextDecoder().decode(bytes));
}

/* ---------- 사진 ---------- */
function handlePhoto(file, memberId) {
  if (!file) return;
  if (!/^image\//.test(file.type)) { toast('이미지 파일만 고를 수 있어요'); return; }
  const reader = new FileReader();
  reader.onload = function () {
    const img = new Image();
    img.onload = function () {
      const size = 192;
      const cv = document.createElement('canvas');
      cv.width = size; cv.height = size;
      const ctx = cv.getContext('2d');
      const s = Math.min(img.width, img.height);
      const sx = (img.width - s) / 2, sy = (img.height - s) / 2;
      ctx.fillStyle = '#FFF8E7'; ctx.fillRect(0, 0, size, size);
      ctx.drawImage(img, sx, sy, s, s, 0, 0, size, size);
      let url = '';
      try { url = cv.toDataURL('image/jpeg', 0.82); } catch (e) { url = ''; }
      if (!url) { toast('사진을 처리하지 못했어요'); return; }
      state.members[memberId].photo = url;
      save();
      renderAll();
      openSettings();
      toast(name(memberId) + ' 프로필 사진을 바꿨어요!');
    };
    img.onerror = function () { toast('사진을 읽지 못했어요'); };
    img.src = reader.result;
  };
  reader.readAsDataURL(file);
}

function toggleStamp(kid, date) {
  state.stamps[kid] = state.stamps[kid] || {};
  if (state.stamps[kid][date]) { delete state.stamps[kid][date]; toast('도장을 지웠어요'); }
  else { state.stamps[kid][date] = true; toast('도장 쾅! 🐾'); }
  save(); renderHome();
}

function toggleStudy(mid, id) {
  const it = (state.study[mid] || []).filter(x => x.id === id)[0];
  if (!it) return;
  const t = TODAY();
  const st = stickerState(mid);
  const n = Math.max(1, Number(it.count) || 1);
  if (it.doneDate === t) {
    it.doneDate = null;
    if (it.weeklyGoal) it.weekDays = (it.weekDays || []).filter(d => d !== t);
    const idx = st.entries.findIndex(e => e.kind === 'study' && e.itemId === id && e.date === t);
    if (idx >= 0) st.entries.splice(idx, 1);
    save(); renderAll();
    toast('스티커 ' + n + '개를 회수했어요');
    return;
  }
  it.doneDate = t;
  st.entries.push({ id: uid(), n: n, kind: 'study', itemId: it.id, itemText: it.text, memo: it.text, date: t, at: Date.now() });
  if (it.weeklyGoal && (it.weekDays || []).indexOf(t) < 0) { it.weekDays = (it.weekDays || []).concat([t]); }
  markStamp(mid);
  save(); renderAll();
  if (it.weeklyGoal && weekDone(it) >= it.weeklyGoal) toast('🎉 이번 주 인강 ' + it.weeklyGoal + '회 다 들었어요!');
  else toast('잘했어요! 칭찬스티커 ' + n + '개를 붙였어요 ⭐');
  maybeCelebrate(mid);
}

function toggleTodo(mid, id) {
  const it = (state.todos[mid] || []).filter(x => x.id === id)[0];
  if (!it) return;
  it.done = !it.done;
  it.doneDate = it.done ? TODAY() : null;
  if (it.done && KIDS.indexOf(mid) >= 0) markStamp(mid);
  save(); renderAll();
}

    case 'toggle-stamp': toggleStamp(id, el.dataset.date); break;

    /* 공부 */
    case 'study-kid': state.ui.studyChild = id; save(); renderStudy(); break;
    case 'study-toggle': toggleStudy(mid, id); break;

/* ---------- 1) 문서 만들기 (이 기기 상태 → 서버에 보낼 한 덩어리) ---------- */
function metaSig(it) {
  const c = {};
  Object.keys(it).forEach(k => { if (k !== '_t' && k !== '_o') c[k] = it[k]; });
  return JSON.stringify(c);
}

function cloneJSON(o) { return JSON.parse(JSON.stringify(o)); }

/* 목록을 훑어 바뀐 항목에만 시각(_t)을 새로 찍고, 사라진 항목은 묘비로 남깁니다
   (서버로 보내는 사본을 따로 만들어 비교해야 이 기기 상태를 고친 것이 잡힙니다) */
function stampList(prevList, list, prefix, now) {
  const prevById = {};
  (prevList || []).forEach(it => { if (it && it.id) prevById[it.id] = it; });
  const seen = {};
  const out = (list || []).map(function (it, i) {
    const p = prevById[it.id];
    const changed = !p || metaSig(p) !== metaSig(it);
    const c = cloneJSON(it);
    c._t = changed ? now : (p._t || 0);
    c._o = (p && p._o) ? p._o : now + i * 0.001;
    it._t = c._t;
    it._o = c._o;
    seen[it.id] = true;
    return c;
  });
  (prevList || []).forEach(function (p) {
    if (p && p.id && !seen[p.id]) syncDel[prefix + ':' + p.id] = now;
  });
  return out;
}

function buildWire() {
  const now = Date.now();
  const prev = syncPrevWire || null;
  const w = {
    v: 3, t: now,
    members: {}, todos: {}, study: {}, stickers: {}, stamps: {},
    mission: null, chat: { messages: [] }, del: {}
  };

  ORDER.forEach(function (id) {
    /* 가족 프로필 — 기본 캐릭터 사진은 코드에 있으니 DB에는 바꾼 사진만 */
    const m = state.members[id] || {};
    const ph = (m.photo && m.photo !== PHOTOS[id]) ? m.photo : '';
    const pm = prev && prev.members ? prev.members[id] : null;
    w.members[id] = {
      name: m.name || MEMBERS[id].name,
      photo: ph,
      _t: (pm && pm.name === (m.name || MEMBERS[id].name) && (pm.photo || '') === ph) ? (pm._t || 0) : now
    };

    w.todos[id] = stampList(prev && prev.todos ? prev.todos[id] : null, state.todos[id] || [], 'todos.' + id, now);

    if (KIDS.indexOf(id) >= 0) {
      w.study[id] = stampList(prev && prev.study ? prev.study[id] : null, state.study[id] || [], 'study.' + id, now);

      const st = stickerState(id);
      const ps = prev && prev.stickers ? prev.stickers[id] : null;
      const entries = stampList(ps ? ps.entries : null, st.entries || [], 'stickers.' + id, now);
      const boardsChanged = !ps || Number(ps.boards) !== (Number(st.boards) || 0);
      w.stickers[id] = {
        boards: Number(st.boards) || 0,
        _t: boardsChanged ? now : (ps._t || 0),
        entries: entries
      };

      /* 도장 — 날짜별로 찍힌 시각을 남깁니다 */
      const cur = state.stamps[id] || {};
      const pst = prev && prev.stamps ? (prev.stamps[id] || {}) : {};
      const stamps = {};
      Object.keys(cur).forEach(function (d) {
        if (!cur[d]) return;
        stamps[d] = typeof cur[d] === 'number' ? cur[d] : (pst[d] || now);
      });
      Object.keys(pst).forEach(function (d) { if (!stamps[d]) syncDel['stamps.' + id + ':' + d] = now; });
      w.stamps[id] = stamps;
    }
  });

  const mis = state.mission || {};
  const pmis = prev && prev.mission;
  w.mission = {
    date: mis.date, id: mis.id, doneCount: Number(mis.doneCount) || 0,
    _t: (pmis && pmis.date === mis.date && pmis.id === mis.id && (Number(pmis.doneCount) || 0) === (Number(mis.doneCount) || 0)) ? (pmis._t || 0) : now
  };

  w.chat.messages = stampList(prev && prev.chat ? prev.chat.messages : null, state.chat.messages || [], 'chat', now);

  /* 묘비는 30일이 지나면 정리 */
  const cut = now - 30 * 864e5;
  const del = {};
  Object.keys(syncDel).forEach(k => { if (syncDel[k] > cut) del[k] = syncDel[k]; });
  const pdel = (prev && prev.del) || {};
  Object.keys(pdel).forEach(k => { if (del[k] === undefined && pdel[k] > cut) del[k] = pdel[k]; });
  w.del = del;
  syncDel = Object.assign({}, del);
  return w;
}

/* ---------- 2) 두 문서 합치기 (항목별 마지막 변경이 이김) ---------- */
function mergeList(la, lb, prefix, del) {
  const map = {};
  (la || []).forEach(it => { if (it && it.id) map[it.id] = it; });
  (lb || []).forEach(it => {
    if (!it || !it.id) return;
    const cur = map[it.id];
    if (!cur || (it._t || 0) > (cur._t || 0)) map[it.id] = it;
  });
  const out = [];
  Object.keys(map).forEach(function (k) {
    const it = map[k];
    const dt = del[prefix + ':' + k] || 0;
    if (dt && dt >= (it._t || 0)) return;
    out.push(it);
  });
  out.sort(function (x, y) {
    return ((x._o || 0) - (y._o || 0)) || ((x.at || 0) - (y.at || 0));
  });
  return out;
}

function mergeWire(a, b) {
  if (!a) return b ? JSON.parse(JSON.stringify(b)) : buildWire();
  if (!b) return JSON.parse(JSON.stringify(a));
  const out = {
    v: 3, t: Math.max(a.t || 0, b.t || 0),
    members: {}, todos: {}, study: {}, stickers: {}, stamps: {},
    mission: null, chat: { messages: [] }, del: {}
  };

  const del = {};
  [a.del || {}, b.del || {}].forEach(m => Object.keys(m).forEach(k => {
    del[k] = Math.max(Number(del[k]) || 0, Number(m[k]) || 0);
  }));
  out.del = del;

  ORDER.forEach(function (id) {
    const am = (a.members || {})[id] || {};
    const bm = (b.members || {})[id] || {};
    out.members[id] = (!am._t && bm._t) ? bm : ((bm._t || 0) > (am._t || 0) ? bm : am);

    out.todos[id] = mergeList((a.todos || {})[id], (b.todos || {})[id], 'todos.' + id, del);

    if (KIDS.indexOf(id) >= 0) {
      out.study[id] = mergeList((a.study || {})[id], (b.study || {})[id], 'study.' + id, del);

      const as = (a.stickers || {})[id] || { entries: [] };
      const bs = (b.stickers || {})[id] || { entries: [] };
      const boards = (!as._t) ? bs : ((bs._t || 0) > (as._t || 0) ? bs : as);
      out.stickers[id] = {
        boards: Number(boards.boards) || 0,
        _t: Number(boards._t) || 0,
        entries: mergeList(as.entries, bs.entries, 'stickers.' + id, del)
      };

      const st = {};
      [(a.stamps || {})[id] || {}, (b.stamps || {})[id] || {}].forEach(m => Object.keys(m).forEach(function (d) {
        st[d] = Math.max(Number(st[d]) || 0, Number(m[d]) || 0);
      }));
      Object.keys(st).forEach(function (d) {
        const dt = del['stamps.' + id + ':' + d] || 0;
        if (dt && dt >= st[d]) delete st[d];
      });
      out.stamps[id] = st;
    }
  });

  const amm = a.mission || {};
  const bmm = b.mission || {};
  out.mission = (bmm._t || 0) > (amm._t || 0) ? bmm : amm;

  out.chat.messages = mergeList((a.chat || {}).messages, (b.chat || {}).messages, 'chat', del);
  return out;
}

/* ---------- 3) 문서 → 이 기기 상태 ---------- */
function wireToState(w) {
  const next = {
    members: {}, todos: {}, study: {}, stickers: {}, stamps: {},
    mission: {}, chat: { messages: [] }
  };
  ORDER.forEach(function (id) {
    const m = w.members[id] || {};
    const cur = state.members[id] || {};
    next.members[id] = {
      name: m.name || cur.name || MEMBERS[id].name,
      photo: m.photo || PHOTOS[id]
    };
    next.todos[id] = (w.todos[id] || []).map(x => cloneJSON(x));
    if (KIDS.indexOf(id) >= 0) {
      next.study[id] = (w.study[id] || []).map(x => cloneJSON(x));
      const s = w.stickers[id] || { entries: [] };
      next.stickers[id] = {
        boards: Number(s.boards) || 0,
        entries: (s.entries || []).map(x => cloneJSON(x))
      };
      const st = {};
      const ws = w.stamps[id] || {};
      Object.keys(ws).forEach(function (d) { st[d] = true; });
      next.stamps[id] = st;
    }
  });
  next.mission = Object.assign({}, w.mission || state.mission);
  next.chat = { messages: ((w.chat || {}).messages || []).map(x => cloneJSON(x)) };
  return next;
}

function contentSig(s) {
  try {
    return JSON.stringify({
      members: s.members, todos: s.todos, study: s.study, stickers: s.stickers,
      stamps: s.stamps, mission: s.mission, chat: s.chat
    }, function (k, v) { return (k === '_t' || k === '_o') ? undefined : v; });
  } catch (e) { return String(Math.random()); }
}

function syncRender() {
  const act = document.activeElement;
  const typing = act && act.id === 'chatInput';
  const pos = typing ? [act.selectionStart, act.selectionEnd] : null;
  renderAll();
  if (typing) {
    const el = $('#chatInput');
    if (el) {
      el.focus();
      try { el.setSelectionRange(pos[0], pos[1]); } catch (e) { /* 무시 */ }
    }
  }
}

/* 이 기기에만 있는 내용(다른 폰이 아직 못 받은 것)이 있는지 */
function hasExtra(a, b) {
  let extra = false;
  const check = function (la, lb) {
    const ids = {};
    (lb || []).forEach(it => { if (it && it.id) ids[it.id] = true; });
    (la || []).forEach(it => { if (it && it.id && !ids[it.id]) extra = true; });
  };
  ORDER.forEach(function (id) {
    check(a.todos[id], b.todos[id]);
    if (KIDS.indexOf(id) >= 0) {
      check(a.study[id], b.study[id]);
      check((a.stickers[id] || {}).entries, (b.stickers[id] || {}).entries);
    }
  });
  check(a.chat.messages, b.chat.messages);
  const bd = b.del || {};
  Object.keys(a.del || {}).forEach(function (k) {
    if (!bd[k] || bd[k] < a.del[k]) extra = true;
  });
  return extra;
}

/* ---------- 4) 서버에서 받기 ---------- */
function syncApplyRemote(remote) {
  if (!remote || typeof remote !== 'object' || (!remote.v && !remote.members)) return;
  syncSeeded = true;
  const local = buildWire();
  const merged = mergeWire(local, remote);
  syncRemoteWire = remote;

  const next = wireToState(merged);
  const changed = contentSig(state) !== contentSig(next);
  if (changed) {
    state.members = next.members;
    state.todos = next.todos;
    state.study = next.study;
    state.stickers = next.stickers;
    state.stamps = next.stamps;
    state.mission = next.mission;
    state.chat = next.chat;
    persist();
    syncRender();
  }
  syncPrevWire = merged;
  syncLastSyncAt = Date.now();
  markLinked();
  setSync(syncRealtimeOk ? 'live' : 'poll');
  if (hasExtra(local, remote)) queueSync();
}

async function syncPull() {
  if (navigator.onLine === false) { setSync('offline'); return; }
  try {
    const res = await fetch(SYNC_ENDPOINT + '?id=eq.' + encodeURIComponent(SYNC_ROW) + '&select=data,updated_at', {
      headers: syncHeaders(), cache: 'no-store'
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const rows = await res.json();
    const data = rows && rows[0] ? rows[0].data : null;
    syncLastError = '';
    const usable = !!(data && Number(data.v) >= 3 && data.members && data.todos && data.study && data.stickers && data.chat);
    if (!usable) {                    /* 서버가 비어 있거나 이전 형식이면 이 기기 기록을 올립니다 */
      syncSeeded = true;
      markLinked();
      setSync(syncRealtimeOk ? 'live' : 'poll');
      queueSync();
      return;
    }
    if (!syncSeeded || !syncEverLinked) {   /* 처음 연결한 기기: 가족 클라우드 기록을 그대로 받아 시작 */
      const next = wireToState(data);
      state.members = next.members;
      state.todos = next.todos;
      state.study = next.study;
      state.stickers = next.stickers;
      state.stamps = next.stamps;
      state.mission = next.mission;
      state.chat = next.chat;
      persist();
      renderAll();
      syncPrevWire = data;
      syncRemoteWire = data;
      syncSeeded = true;
      markLinked();
      syncLastSyncAt = Date.now();
      setSync(syncRealtimeOk ? 'live' : 'poll');
      return;
    }
    if (JSON.stringify(data) === JSON.stringify(syncRemoteWire)) {
      syncLastSyncAt = Date.now();
      setSync(syncRealtimeOk ? 'live' : 'poll');
      return;
    }
    syncApplyRemote(data);
  } catch (e) {
    syncLastError = String((e && e.message) || e);
    setSync('offline');
  }
}

/* ---------- 5) 서버에 올리기 ---------- */
function queueSync() {
  if (syncPushTimer) return;
  syncPushTimer = setTimeout(function () {
    syncPushTimer = null;
    syncPush();
  }, 340);
}

async function syncPush() {
  /* 새 기기는 서버 기록을 먼저 받아 온 뒤에 올립니다 (기본값으로 덮어쓰지 않도록) */
  if (!syncSeeded) return;
  if (syncBusy) { queueSync(); return; }
  syncBusy = true;
  const body = syncRemoteWire ? mergeWire(buildWire(), syncRemoteWire) : buildWire();
  try {
    const res = await fetch(SYNC_ENDPOINT + '?id=eq.' + encodeURIComponent(SYNC_ROW), {
      method: 'PATCH',
      headers: syncHeaders({ 'Content-Type': 'application/json', Prefer: 'return=minimal' }),
      body: JSON.stringify({ data: body, updated_at: new Date().toISOString() })
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    syncPrevWire = body;
    syncLastSyncAt = Date.now();
    syncLastError = '';
    markLinked();
    setSync(syncRealtimeOk ? 'live' : 'poll');
  } catch (e) {
    syncLastError = String((e && e.message) || e);
    setSync('offline');
  } finally {
    syncBusy = false;
    paintSync();
  }
}

function syncNow() {
  syncPull().then(function () { queueSync(); });
  toast('가족 기록과 맞추는 중이에요');
}

/* ---------- 6) 실시간(Realtime) 구독 + 보조 폴링 ---------- */
function syncRealtime() {
  if (!(window.supabase && window.supabase.createClient)) return;
  try {
    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
      auth: { persistSession: false, autoRefreshToken: false }
    });
    sb.channel('family-log-' + Math.random().toString(36).slice(2))
      .on('postgres_changes', {
        event: '*', schema: 'public', table: 'family_state', filter: 'id=eq.' + SYNC_ROW
      }, function (payload) {
        const data = payload && payload.new ? payload.new.data : null;
        if (data) syncApplyRemote(data);
      })
      .subscribe(function (status) {
        if (status === 'SUBSCRIBED') { syncRealtimeOk = true; setSync('live'); }
        else if (status === 'CHANNEL_ERROR' || status === 'TIMED_OUT' || status === 'CLOSED') {
          syncRealtimeOk = false;
          setSync(navigator.onLine === false ? 'offline' : 'poll');
        }
      });
  } catch (e) {
    syncRealtimeOk = false;
  }
}

function syncStart() {
  syncStatus = 'start';
  paintSync();
  syncSeeded = localExisted;
  syncPull();
  syncRealtime();

  syncPullTimer = setInterval(function () {
    if (document.hidden) return;
    if (syncRealtimeOk && Date.now() - syncLastSyncAt < 6000) return;
    syncPull();
  }, 2500);

  document.addEventListener('visibilitychange', function () { if (!document.hidden) syncPull(); });
  window.addEventListener('focus', function () { syncPull(); });
  window.addEventListener('online', function () { toast('다시 연결됐어요 · 기록을 맞추는 중'); syncPull(); queueSync(); });
  window.addEventListener('offline', function () { setSync('offline'); });
}

/* =========================================================
   8. 시작
   ========================================================= */
$('#logo').innerHTML = LOGO;
(function () { var n = document.querySelector('#nav button[data-id="todo"] .ico'); if (n) n.innerHTML = ICON_CHECK; })();
(function () { var s = document.querySelector('#nav button[data-id="sticker"] .ico'); if (s) s.innerHTML = STAR_NAV; })();

(function init() {
  rollover();
  timer.mode = state.ui.timerMode || 'left';
  timer.minutes = state.ui.timerMinutes || 10;
  timer.remaining = timer.minutes * 60;
  save();
  renderAll();
  loadWeather();
  syncStart();
  window.addEventListener('beforeunload', save);
})();

window.FAMILY_LOG = {
  get state() { return state; },
  save: save,
  sync: { pull: syncPull, push: syncPush, now: syncNow, status: function () { return syncStatus; } }
};
})();
</script>
